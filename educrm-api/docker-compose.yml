version: "3.9"

networks:
  app_network:
    driver: bridge

volumes:
  pg_data:

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - app_network
    environment:
      POSTGRES_DB:       educrm
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Port 5432 intentionally NOT exposed to host (internal only)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educrm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── FastAPI backend ────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/educrm
      APP_ENV:      production
      APP_PORT:     "8000"
    # Port 8000 intentionally NOT exposed to host — Nginx handles ingress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s